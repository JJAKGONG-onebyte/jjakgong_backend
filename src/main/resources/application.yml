spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: 1800000 # 30분
  refresh-expiration-ms: 1209600000 # 14일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
